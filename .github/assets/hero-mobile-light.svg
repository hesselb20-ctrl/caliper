<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" width="420" height="430" role="img" aria-label="Caliper: Parametric CAD from photos and one measurement.">
<style>
.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.ink{fill:#111111}.mute{fill:#5F5F5F}.acc{fill:#000000}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes fade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:dash 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="420" height="430" rx="3" fill="#F5F5F5"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E8E8E8" stroke-width="1"/></pattern></defs>
<rect width="420" height="430" rx="3" fill="url(#g)"/>
<path d="M24 14H14V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M396 14H406V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M24 416H14V406" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M396 416H406V406" fill="none" stroke="#5F5F5F" stroke-width="1"/>
<text x="30" y="52" class="m mute" font-size="9.5">Photo to CAD</text>
<g transform="translate(30 68)"><circle class="pulse" r="3" cx="3" cy="0" fill="#000000"/><text x="14" y="4" class="m acc" font-size="9.5">Prototype · synthetic test only</text></g>
<text x="28" y="134" class="s ink" font-size="44" font-weight="600" letter-spacing="-1.5">Caliper</text>
<text x="30" y="164" class="s mute" font-size="15">Parametric CAD from photos</text><text x="30" y="185" class="s mute" font-size="15">and one known measurement.</text>
<line x1="30" y1="344" x2="390" y2="344" stroke="#C8C8C8"/>
<rect x="30" y="343" width="56" height="2" fill="#000000" style="--d:304px;animation:sweep 16s ease-in-out infinite alternate"/>
<text x="30" y="368" class="m" font-size="9.5"><tspan class="mute">Input</tspan><tspan class="ink" dx="10">1-4 photos + one measurement</tspan></text><text x="30" y="385" class="m" font-size="9.5"><tspan class="mute">Output</tspan><tspan class="ink" dx="10">STEP, STL, editable params</tspan></text><text x="30" y="402" class="m" font-size="9.5"><tspan class="mute">Real photos tested</tspan><tspan class="ink" dx="10">0</tspan></text>
<g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.300;0.375;0.400;0.404;1" values="1;1;0;0;1;1"/>
