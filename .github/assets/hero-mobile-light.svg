<path d="M178.5 320.5L185.5 313.5" stroke="#000000" stroke-width="1.3"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.383;0.388;0.800;0.842;1" values="1;1;0;0;1;1"/></path><path d="M234.5 320.5L241.5 313.5" stroke="#000000" stroke-width="1.3"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.383;0.388;0.800;0.842;1" values="1;1;0;0;1;1"/></path>
<text x="210.0" y="331.0" class="m acc" font-size="10" text-anchor="middle">40 mm known<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.383;0.388;0.817;0.883;1" values="1;1;0;0;1;1"/></text>
