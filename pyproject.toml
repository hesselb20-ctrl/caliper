[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper-cad"
version = "0.1.0"
description = "Photos plus one known measurement in, parametric CAD out (STEP, STL, editable parameters)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.4",
    "opencv-contrib-python>=4.8",
    "numpy>=1.24",
    "pillow>=10",
    "anthropic>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.8"]

[project.scripts]
caliper = "caliper.cli:main"

[tool.setuptools.packages.find]
include = ["caliper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
